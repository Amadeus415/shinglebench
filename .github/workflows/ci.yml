name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {version: "0.11.7"}
      - run: uv sync
      - run: uv run playwright install --with-deps chromium
      - run: uv run shingle tasks validate
      - run: uv run pytest
        env: {SANDBOX_BACKEND: local}
      - name: Public export excludes held-out tasks
        run: ./scripts/export_public.sh
