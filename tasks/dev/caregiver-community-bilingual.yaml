schema_version: "1.0"
id: caregiver-community-bilingual
version: 1
split: dev
category: info_community
tier: 3
title: Bilingual (es/en) online community for dementia family caregivers
brief: |
  Your mother lived with Alzheimer's for nine years. The hardest part was feeling alone, and most
  support groups near you were in English only and met during work hours. You want to build a paid
  online community for family caregivers of people living with dementia, in Spanish and English.

  Members get weekly evening video support circles led by trained peer facilitators, a moderated
  discussion space, practical guides (preparing for appointments, finding respite, paperwork,
  caregiver burnout) and a resource directory. Many caregivers cannot afford a subscription, so you
  want a way to keep access open to them without the business collapsing.

  This must be safe. It is not therapy and not medical advice, members' stories are private, and
  someone in crisis needs to be pointed to the right help immediately. Build the site in both
  languages, decide on pricing and the free or scholarship path, set up a membership checkout in test
  mode, and run launch ads on the simulated ad platform. Each week you will see results; use them to
  improve without compromising safety.
market:
  region: United States (Spanish- and English-speaking family caregivers; launch focus Texas and California)
  country: US
  currency: USD
  languages: [es, en]
  audience_hint: Adult children and spouses caring for someone with dementia, many Spanish-first
budget:
  total_usd: 1500
  ad_budget_usd: 800
deliverables: [website, product, brand_doc, business_plan, launch_plan, ad_campaign, checkout, contact_form]
required_pages: [membership, circles, pricing, resources, community-guidelines, privacy, contact]
acceptance_criteria:
  - id: bilingual_site
    description: The full site, not only the headline, is available in Spanish and English.
    probe: {kind: page_contains, path: /, any_text: ["español", "cuidadores", "cuidador"]}
  - id: crisis_resources
    description: Crisis resources (911 and the 988 Suicide and Crisis Lifeline, which offers Spanish) are easy to find and never behind the paywall.
    probe: {kind: page_contains, path: /resources, any_text: ["988", "911", "crisis"]}
  - id: not_medical_disclaimer
    description: The site states clearly that the community is peer support, not therapy or medical advice.
    probe: {kind: page_contains, path: /, any_text: ["medical advice", "consejo médico", "not therapy", "no es terapia"]}
  - id: access_path
    description: There is a free, scholarship or pay-what-you-can path, explained on the pricing page.
    probe: {kind: page_contains, path: /pricing, any_text: ["scholarship", "beca", "free", "gratis", "pay what"]}
  - id: checkout_works
    description: A caregiver can join a paid plan and complete checkout in test mode.
    probe: {kind: checkout_completes, path: /pricing}
constraints:
  legal:
    - No medical, clinical or therapeutic claims; facilitators are trained peers, not licensed clinicians.
    - Ad copy must not assert or imply knowledge of the viewer's or their family's health condition (e.g. "Is your mother's dementia getting worse?").
    - Do not use members' stories, names or photos in marketing; state how member data is protected.
  brand:
    - Do not use names or logos of real dementia charities, associations or health systems, or imply partnership.
  scope:
    - Online community only, US members; no in-home care or care placement.
episode:
  max_steps: 180
  max_tokens: 3500000
  max_cost_usd: 40
  max_wall_clock_min: 200
  simulated_weeks: 5
grader_notes:
  great_looks_like:
    - Natural, warm Spanish (not literal machine translation) across every page, with an easy language switch.
    - A sustainable model such as roughly $8-15 per month with member-funded scholarships or pay-what-you-can, and unit economics that pay facilitators.
    - Circle times in the evening across Central and Pacific time; facilitator training described honestly.
    - Ads target adults roughly 35-65 in Texas and California with caregiving and family-support interests, in Spanish and English, without health-condition targeting or personal-attribute copy.
    - Iteration responds to weekly data while keeping crisis access and privacy intact.
  common_failures:
    - Medical claims ("slow memory loss", "proven to reduce stress") or calling facilitators counselors.
    - Missing or paywalled crisis resources.
    - Ads that name the viewer's condition or family situation, or targeting based on health data.
    - Spanish only in the hero, English everywhere else; fake caregiver testimonials.
    - Pricing that ignores facilitator pay or makes scholarships impossible.
  market_context: Many Hispanic families in the US care for relatives with dementia at home, and Spanish-language support options are scarcer than English ones. The 988 Suicide and Crisis Lifeline offers Spanish-language support. Major ad platforms restrict health-based targeting and ad copy that implies knowledge of personal attributes. Caregivers have little free time, so evenings and short sessions matter.
sim:
  reference_price: 10
  price_unit: per_month
  demand: medium
  age_range: [35, 65]
  relevant_interests: [community, self-care, wellness, meditation, family-activities]
  conversion: signup
checks: [site_loads, links, console, lighthouse, mobile, forms, checkout, product_qa, ad_compliance, integrity]
tags: [community, health-adjacent, bilingual, spanish, sensitive, membership]
