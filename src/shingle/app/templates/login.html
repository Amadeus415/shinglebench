{% extends "base.html" %}{% block body %}<div class="card login"><h1>Sign in</h1>
{% if error %}<p class="chip fail" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login"><input type="hidden" name="next" value="{{ next }}">
<p><label>Username<br><input type="text" name="username" autocomplete="username" required></label></p>
<p><label>Password<br><input type="password" name="password" autocomplete="current-password" required></label></p>
<button class="btn" type="submit">Sign in</button></form>
<p class="muted small">Local defaults: admin/admin, grader1/grader, grader2/grader (change via ADMIN_PASSWORD / GRADER_PASSWORD).</p></div>{% endblock %}
