[project]
name = "shingle"
version = "0.1.0"
description = "ShingleBench: can an AI model start a real business end to end?"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pillow>=10.3",
    "playwright>=1.47",
    "markdown>=3.6",
    "anthropic>=2.3.0",
]

[project.scripts]
shingle = "shingle.cli:app"

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["browser: needs a Playwright Chromium install"]
