# Model configurations. `name` is what eval configs reference.
# Real providers activate when their api_key_env is set; otherwise `shingle run` refuses them
# (the demo config falls back to mocks automatically). Prices are USD per million tokens;
# verify against provider pricing pages before publishing cost numbers.
models:
  # --- scripted baselines (no API key needed) ---------------------------------
  - name: mock-diligent
    provider: mock
    model: diligent
    family: mock-scripted
    price_in_per_mtok: 0.0
    price_out_per_mtok: 0.0
  - name: mock-hasty
    provider: mock
    model: hasty
    family: mock-scripted
    price_in_per_mtok: 0.0
    price_out_per_mtok: 0.0

  # --- Anthropic (official SDK) ------------------------------------------------
  - name: claude-opus-5-5
    provider: anthropic
    model: claude-opus-5-5
    family: anthropic
    api_key_env: ANTHROPIC_API_KEY
    max_output_tokens: 16000
    context_window: 1000000
    price_in_per_mtok: 4.0
    price_out_per_mtok: 20.0
    price_cached_in_per_mtok: 0.2
    extra: {effort: high}
  - name: claude-sonnet-5-5
    provider: anthropic
    model: claude-sonnet-5-5
    family: anthropic
    api_key_env: ANTHROPIC_API_KEY
    max_output_tokens: 16000
    context_window: 1000000
    price_in_per_mtok: 2.0
    price_out_per_mtok: 10.0
    price_cached_in_per_mtok: 0.2
    extra: {effort: high}

  # --- OpenAI (Chat Completions) — set the model id you want to evaluate ------
  - name: openai-gpt-5
    provider: openai
    model: gpt-5
    family: openai
    api_key_env: OPENAI_API_KEY
    max_output_tokens: 16000
    context_window: 400000
    price_in_per_mtok: 1.25
    price_out_per_mtok: 10.0

  # --- Google (Gemini REST) ----------------------------------------------------
  - name: gemini-2-5-pro
    provider: google
    model: gemini-2.5-pro
    family: google
    api_key_env: GOOGLE_API_KEY
    max_output_tokens: 16000
    context_window: 1000000
    price_in_per_mtok: 1.25
    price_out_per_mtok: 10.0

  # --- Open-weight via any OpenAI-compatible endpoint (vLLM, Together, etc.) ---
  - name: open-weights-compat
    provider: openai_compat
    model: meta-llama/Llama-3.3-70B-Instruct
    family: meta
    api_key_env: OPENAI_COMPAT_API_KEY
    base_url_env: OPENAI_COMPAT_BASE_URL
    max_output_tokens: 8000
    context_window: 128000
    price_in_per_mtok: 0.6
    price_out_per_mtok: 0.6
